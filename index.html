<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="gallery">
        <img src="https://share.google/jTd0nxvq9KAIKSnh6" alt="Image 1" onclick="openLightbox(this)">
        <img src="https://share.google/k5DAIYsuZAvhkUXFL" alt="Image 2" onclick="openLightbox(this)">
        <img src="https://share.google/3R2pjaC4ebHmeWqhK" alt="Image 3" onclick="openLightbox(this)">
        <img src="https://share.google/jB3rR1lh2QJntY6Wq" alt="Image 4" onclick="openLightbox(this)">
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
